name: Unzip and Build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # If any .zip sits in the repo root, extract it into the root,
      # delete the zip, and commit the result. Otherwise this step does nothing.
      - name: Unzip project archive
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -gt 0 ]; then
            for z in "${zips[@]}"; do
              unzip -o -q "$z" -x '__MACOSX/*' -x '.github/*'
              rm -f "$z"
            done
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unzip project archive" || true
            git push
          else
            echo "No zip found, skipping."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.5.1

      - name: Build
        run: gradle build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: netherite-anvil-upgrade
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
